<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strudel ao vivo</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <!-- Strudel (editor + motor de áudio) direto da CDN, versão fixa.
         Para atualizar, troque o número da versão (veja o README). -->
    <script src="https://unpkg.com/@strudel/repl@1.3.0/dist/index.js"></script>
  </head>
  <body class="na-biblioteca">
    <!-- Tela inicial: todos os sons em caixas -->
    <section id="tela-biblioteca">
      <header class="barra">
        <strong class="titulo">Meus sons</strong>
        <button id="novo" type="button">＋ Novo</button>
        <button id="exportar" type="button" title="Baixa todos os sons e históricos num arquivo .json">⬇ Exportar tudo</button>
        <button id="importar" type="button" title="Carrega um arquivo .json exportado antes">⬆ Importar</button>
        <input id="arquivo-importar" type="file" accept=".json,application/json" hidden />
        <span id="status-biblioteca" class="status">carregando…</span>
      </header>
      <main id="grade" class="grade"></main>
    </section>

    <!-- Editor de um som -->
    <section id="tela-editor">
      <header class="barra">
        <button id="voltar" type="button" title="Volta para a lista (o código fica salvo)">← Sons</button>
        <input id="nome" class="nome" type="text" aria-label="Nome do som" />
        <button id="tocar" type="button" title="Ctrl+Enter">▶ Tocar</button>
        <button id="parar" type="button" title="Ctrl+.">■ Parar</button>
        <label class="campo" title="Reavalia o código sozinho enquanto você digita (só quando já está tocando)">
          <input id="ao-vivo" type="checkbox" />
          Ao vivo
        </label>
        <button id="salvar-versao" type="button" title="Guarda o código atual no histórico">✚ Salvar versão</button>
        <button id="abrir-historico" type="button">🕘 Histórico</button>
        <button id="baixar" type="button" title="Baixa o código atual como .txt">⬇ .txt</button>
        <span id="status" class="status"></span>
      </header>
      <div class="corpo-editor">
        <main id="area-editor"></main>
        <aside id="historico" class="historico" hidden>
          <h2>Histórico</h2>
          <p class="dica">Uma versão é guardada quando você clica em “Salvar versão” e sempre que sai do editor com mudanças.</p>
          <ol id="lista-versoes"></ol>
        </aside>
      </div>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
